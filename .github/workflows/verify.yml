# Generated by `ops catalog gen` from `catalogWorkflows` in
# .hyperfoundry/ops/config.yml. Not edited by hand: change the configuration and
# run the command again; its `--validate` refuses a copy that has fallen behind.
#
# The catalogs' merge check: every release a pull request carries must name a
# commit on its source repository's default branch. `ops release catalog
# verify` makes the check; it runs from a checkout of the tree, whose root runs
# every application in it directly. The same job holds this repository's
# workflows to what `ops catalog gen` writes from its configuration, so a
# workflow edited by hand, or configuration nothing was generated from, does
# not merge.
#
# It acts as the tree's CI app, from the `CI_APP_ID` variable and the
# `CI_APP_PRIVATE_KEY` secret this repository holds: a token minted as the
# step before its first read, contents read alone, on every repository the
# app's installation reaches -- the tree and every source repository a
# release names. A repository holding no `CI_APP_ID` fails at that step,
# naming it. It runs on `pull_request` and never on `pull_request_target`, so
# a fork's pull request is handed no credential.
name: verify
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
env:
  UV_PYTHON: '3.13'
jobs:
  verify:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    steps:
      - name: check out the catalogs
        uses: actions/checkout@v4
        with:
          path: catalogs
          fetch-depth: 0
      - name: fetch the branch the pull request targets
        run: git -C catalogs fetch origin "${{ github.event.pull_request.base.ref }}"
      - name: act as the tree's CI app
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: check out the tree
        uses: actions/checkout@v4
        with:
          repository: 'solidplanssoftware/platform'
          ref: 'master'
          path: platform
          submodules: true
          token: ${{ steps.app.outputs.token }}
      - name: let git read the source repositories
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: astral-sh/setup-uv@v5
      - name: hold the workflows to the configuration
        working-directory: platform
        env:
          CATALOG_ROOT: ${{ github.workspace }}/platform
        run: >-
          uv run python -m ops_tool.src.app
          --repo-root "${{ github.workspace }}/catalogs"
          catalog gen --validate
      - name: verify
        working-directory: platform
        env:
          CATALOG_ROOT: ${{ github.workspace }}/platform
        run: >-
          uv run python -m ops_tool.src.app
          --repo-root "${{ github.workspace }}/catalogs"
          release catalog verify
          --base "origin/${{ github.event.pull_request.base.ref }}"
          --head HEAD
