            - pullRequest: 62
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/62
              summary: Updated the documentation for hyphenated checkout directories,
                so impl-tool is checked out at impl-tool and imported as impl_tool.
            - pullRequest: 63
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/63
              summary: Pinned pydantic to 2.13.5, so the tree builds on Python 3.14.
            - pullRequest: 64
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/64
              summary: The generated .gitignore treats /repo-adapter/ as generated
                by dev vendor rather than tracked, and the documentation describes
                how the adapter reaches consumers through the build catalog.
            - pullRequest: 65
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/65
              summary: Moved the schemaVersion of three configuration files from 0.0.0-dev
                to 0.0.0, and marked the upstream catalog store sameTree.
            - pullRequest: 66
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/66
              summary: Renamed the module coordinate from language:repo_adapter to
                language:repo-adapter, and marked the schema versions 0.0.0-dev.
            - pullRequest: 67
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/67
              summary: 'Translated the packaging contract into PyInstaller''s flags:
                modules loaded by name, packages loaded by name and excluded packages,
                and the adapter''s API version is now written as major.minor.patch.'
            - pullRequest: 68
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/68
              summary: The adapter detects test files from the repository's pytest
