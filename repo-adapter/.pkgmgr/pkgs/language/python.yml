            - pullRequest: 54
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/54
              summary: Consolidated the adapter's skip lists into one, rooting build,
                dist, lib, .venv and node_modules at the module root, and exposed
                the language's gitignore rules through the contract.
            - pullRequest: 55
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/55
              summary: Generated schema document models now carry schemaVersion alongside
