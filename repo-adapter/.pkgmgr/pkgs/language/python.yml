                error means.
            - pullRequest: 43
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/43
              summary: Type generation identifies the package named for the distribution
                when a repository publishes several packages under packages/.
            - pullRequest: 44
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/44
              summary: Added a check that a vendored Python tree can import itself,
