            - pullRequest: 71
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/71
              summary: The adapter reports what a module's submodule_api.py facade
                imports, so dev-tool's selection can tell whether a change reaches
                a nested module.
            - pullRequest: 72
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/72
              summary: Clarified in INSTRUCTIONS.md that tests of nested modules belong
