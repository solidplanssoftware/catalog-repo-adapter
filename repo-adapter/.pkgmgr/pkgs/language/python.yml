                rule enforces.
            - pullRequest: 73
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/73
              summary: 'Added test tier support: a test''s tier is the directory it
                sits in under __tests__, and the adapter builds pytest ignore arguments
                for the tiers a run skips.'
            - pullRequest: 74
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/74
              summary: Clarified in INSTRUCTIONS.md that external packages are declared
                and imported at the submodule that uses them, never through the facade.
            - pullRequest: 75
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/75
              summary: Generates PyInstaller spec files that name obtained package
                directories as search paths and walk them to enumerate modules, so
                executables built from a checkout start.
            - pullRequest: 76
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/76
              summary: Removed the labeled trigger from gate.yml and moved the gate
                label start to a separate gate-label workflow, so other labels no
                longer leave a skipped gate check.
            - pullRequest: 78
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/78
              summary: Uses the renamed RepositoryConfigDocument type from the adapter
                contract in every method that takes configuration.
            - pullRequest: 79
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/79
              summary: Compiles executables with Nuitka in standalone mode through
                a generated plugin and driver script, so the artifact holds native
                code rather than bytecode.
            - pullRequest: 80
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/80
              summary: Split the adapter into a language core, language:python-core,
                which is code, and a python adapter configuration document, which
                states the layout the core is given.
            - pullRequest: 81
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/81
              summary: Removed the install verb from the adapter's configuration,
                so sync is now the only install command, and the README says dev sync.
            - pullRequest: 82
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/82
              summary: Added pins.yml, a caller that starts the pins run on a push
                to master and on manual dispatch in each pinned repository.
            - pullRequest: 83
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/83
              summary: The core states its adapter API version, 0.0.0, as a literal
                rather than reading it from the contract, so the loader's version
                check can fail.
            - pullRequest: 84
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/84
              summary: Obtains the internal shared documents beside the client package,
                and CLAUDE.md lists the release process, vision and shipping documents
                from the internal package.
            - pullRequest: 85
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/85
              summary: Declared the Python versions the adapter is for, 3.13 and 3.14,
                and added language_version, which reads the lowest version a repository's
                requires-python admits.
            - pullRequest: 86
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/86
              summary: Counts src-layout packages by how they are imported, and accepts
                Python 3.9 projects.
            - pullRequest: 88
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/88
              summary: A run given no path leaves out git-ignored paths, so vendored
                libraries and fetched adapters with their own tests are no longer
                collected.
            - pullRequest: 89
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/89
              summary: Added an integration test that runs a real pytest tree to hold
                the isolated tier to starting no process, and reports what each test
                tried to start.
            - pullRequest: 90
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/90
              summary: Test directory detection now recognises tests only at the root,
                while __tests__ is recognised at any depth; the store configuration
                key changed from uri to location; and the docs use --validate.
            - pullRequest: 91
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/91
              summary: The adapter reads the error codes a Python package's source
                raises from its syntax tree, without importing the package.
            - pullRequest: 92
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/92
              summary: Added a bundled PyInstaller form beside the Nuitka build, selected
                by form, so internal releases can be bundled rather than compiled.
            - pullRequest: 93
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/93
              summary: 'Hands set-valued configuration to the core as tuples: non-source
                patterns, test directories and test file patterns are read as sets.'
            - pullRequest: 94
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/94
              summary: Compiled applications are now one onefile executable per platform,
                with the binaries signed before they are packed; the bundled form
                still produces a directory.
            - pullRequest: 95
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/95
              summary: Read a module's boundary files external_api.py and submodule_api.py
                through one reader, removed the error-code reader, and no longer exclude
                /build, /dist and /lib from the non-source patterns.
            - pullRequest: 96
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/96
              summary: The adapter reads its glob fields as typed globs, and the ruff
                exclude is written as an anchored pattern so ruff passes over what
                the glob names.
            - pullRequest: 97
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/97
              summary: Marked the pkgmgr configuration 0.0.0-dev, the version its
                newly granted feature flags require.
