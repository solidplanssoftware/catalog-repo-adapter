            - pullRequest: 51
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/51
              summary: Added an anchored /logs/ entry to the adapter's .gitignore.
            - pullRequest: 52
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/52
              summary: Renamed the srcPaths configuration field to ownRoots, and made
