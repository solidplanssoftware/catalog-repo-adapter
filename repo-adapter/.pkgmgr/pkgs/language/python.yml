            - pullRequest: 14
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/14
              summary: Documented the multi-value --scope and --id flags of the followups
                commands in the pr-followup skill.
            - pullRequest: 16
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/16
              summary: Dropped the dev_tool_ prefix from the adapter's package names,
                so the contract is imported as repo_adapter_api and the adapter as
                repo_adapter, and renamed the pwsh template to match.
            - pullRequest: 17
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/17
              summary: Named the application's configuration files and rule-handler
                packages to the packager, so a frozen executable carries the files
                it reads at start-up.
            - pullRequest: 18
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/18
              summary: Advanced the pinned repo adapter to the revision whose impl-tool
                falls back to the branch base for submodules new to a branch, restoring
                their hierarchy section, and that allows nested submodules.
            - pullRequest: 19
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/19
              summary: Moved the library sources into src/ behind root-level facades,
                added a manifest.yml, supported single-file module roots, and took
                configuration as serialized data rather than shared models, which
                removes the run-time dependency on dev-tool.
            - pullRequest: 20
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/20
              summary: Changed the build signature to take its entry point, artifact
                name, destination, scratch directory and packaging inputs from the
                caller, so the adapter no longer walks the repository to guess what
                to bundle; lint now runs ruff directly and narrows with --paths.
            - pullRequest: 21
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/21
              summary: Advanced the pinned shared documents to a newer revision.
            - pullRequest: 22
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/22
              summary: Made unnarrowed test runs distribute across cores while narrowed
                runs stay in one process, with the worker count passed on the command
                line rather than through addopts.
            - pullRequest: 23
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/23
              summary: Advanced the pinned shared documents to the revision whose
                review skill ships start-now work before ruling on follow-up items.
            - pullRequest: 24
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/24
              summary: Anchored the build and dist ignore patterns to the repository
                root, so source directories with those names are no longer ignored.
            - pullRequest: 25
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/25
              summary: Advanced the pinned shared documents to the revision that validates
                follow-up text locally and names queue notes by slug in pull request
                bodies.
            - pullRequest: 26
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/26
              summary: Added a post-merge workflow that re-runs checks blocked by
                open submodule pull requests once those pull requests merge.
            - pullRequest: 27
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/27
              summary: Added tree-shape methods that report the directories a tree
                walker should skip, the dotted name of a package, and the package
                data declared in pyproject.toml.
            - pullRequest: 28
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/28
              summary: Changed the adapter's test helper calls to use keyword arguments,
                so the adapter passes the updated lint rules when run standalone.
            - pullRequest: 29
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/29
              summary: Vendored the adapter's platform dependencies into a git-ignored
                lib/ directory declared in .dev-tool/config.yml, pointed pyproject.toml
                and ruff.toml at lib/ instead of sibling checkouts, raised requires-python
                to 3.13, and replaced repo-adapter-api with PyYAML, pydantic and tzdata
                as third-party dependencies.
            - pullRequest: 30
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/30
              summary: Rewrote two README sentences from past tense to present tense,
                with no code change.
            - pullRequest: 31
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/31
              summary: Added a workflow_run trigger to the post-merge workflow, so
                it also runs when pre-merge completes and releases submodules waiting
                on this repository.
            - pullRequest: 32
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/32
              summary: Advanced the pinned shared documents to the revision that aligns
                every nested checkout.
            - pullRequest: 33
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/33
              summary: Added a concurrency group to the post-merge workflow, so a
                burst of runs for one branch collapses to the newest run.
            - pullRequest: 34
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/34
              summary: The post-merge workflow now requests the platform's sweep instead
                of performing it in each repository.
            - pullRequest: 35
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/35
              summary: The adapter reads a module's requirements from both inline
                dependencies and setuptools' dynamic declarations, and renders the
                vendored requirements file from the requirements collected from published
                artifacts.
            - pullRequest: 36
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/36
              summary: 'Added INSTRUCTIONS.md, which documents the Python-specific
                working discipline: the public boundary, the submodule facade, test
                placement, generated files, frozen models and TYPE_CHECKING imports.'
            - pullRequest: 37
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/37
              summary: Declared the adapter as runtime-resolved with a runtimeCoordinate
                in its manifest, and took the lint excludes as a parameter rather
                than reading them from configuration.
            - pullRequest: 38
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/38
              summary: Removed the temporary .gitignore rule that excluded pr-description.yml.
            - pullRequest: 39
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/39
              summary: The lint excludes are now an argument to lint rather than a
                configuration field, so --exclude-path reaches the adapter.
            - pullRequest: 40
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/40
              summary: Renamed the lint method's exclude parameter to camelCase excludePath,
                while the command-line flag stays --exclude-path.
            - pullRequest: 41
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/41
              summary: Pared the repository's CLAUDE.md down to present-tense instructions.
            - pullRequest: 42
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/42
              summary: Documented in the README that an isolated clone needs dev isolate
