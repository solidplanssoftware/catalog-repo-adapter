            - pullRequest: 56
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/56
              summary: Listed release_process.md among the shared documents in CLAUDE.md.
            - pullRequest: 57
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/57
              summary: Added /.dev-tool/resolved.yml to the generated .gitignore,
                so the machine-local resolution record stays out of the working tree.
            - pullRequest: 58
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/58
              summary: Wrote schemaVersion as a three-part version, 0.0.0-dev, in
                the configuration files, as the loader now requires.
            - pullRequest: 59
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/59
              summary: Added a command catalog that mirrors the schema catalog, git-ignored
