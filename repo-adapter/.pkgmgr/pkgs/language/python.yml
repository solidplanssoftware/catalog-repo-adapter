            - pullRequest: 46
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/46
              summary: Made the adapter's commands runnable standalone, and stopped
                overriding pytest's addopts, so tests declared by package name are
                collected from the consumer's own configuration.
            - pullRequest: 47
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/47
              summary: Renamed the vendored context coordinate to impl-tool:context,
                wired the build catalog to the tree through .pkgmgr/config.yml, and
                changed the lint exclude parameter to exclude, taking paths.
            - pullRequest: 48
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/48
              summary: Renamed the catalog variable from PLATFORM_CATALOG_ROOT to
                PARENT_CATALOG_ROOT in the adapter's catalog wiring and documentation,
                and documented that each application's API is its own package.
            - pullRequest: 49
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/49
              summary: Updated the repo-adapter-api dependency to its new repo-adapter-api
                namespace.
            - pullRequest: 50
              url: https://github.com/solidplanssoftware/repo-adapter-python/pull/50
              summary: Changed the adapter's schema test to import the contract types
